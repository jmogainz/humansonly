x-build-network: &build-network
  network: host

x-networks: &networks
  networks:
    - app_network

services:
  frontend:
    build:
      context: .
      dockerfile: humansonly.Dockerfile
      target: deps
      <<: *build-network
      labels:
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME:?Docker Compose Config Error! COMPOSE_PROJECT_NAME is not set!}
        com.docker.compose.service: frontend
      args:
        ENV: ${ENV:?Docker Compose Config Error! ENV is not set!}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:?Docker Compose Config Error! NEXT_PUBLIC_ENV is not set!}
        NEXT_PUBLIC_DEVTOOLS_ENABLED: ${NEXT_PUBLIC_DEVTOOLS_ENABLED:-0}
        ENABLE_NGROK_FOR_DEV: ${ENABLE_NGROK_FOR_DEV:-0}
        ENABLE_CLOUDFLARED_FOR_DEV: ${ENABLE_CLOUDFLARED_FOR_DEV:-0}
        APP_URL_FROM_ANYWHERE: ${APP_URL_FROM_ANYWHERE:-}
      platforms:
        - ${TARGET_PLATFORM:?Docker Compose Config Error! TARGET_PLATFORM is not set!}
    image: ${APP_NAME:?Docker Compose Config Error! APP_NAME is not set!}-frontend
    container_name: ${APP_NAME:?Docker Compose Config Error! APP_NAME is not set!}-frontend_instance
    environment:
      - ENV=${ENV}
      - NODE_ENV=${FRONTEND_NODE_ENV:-development}
      - FRONTEND_RELEASE_MODE=${FRONTEND_RELEASE_MODE:-0}
      - NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV}
      - NEXT_PUBLIC_DEVTOOLS_ENABLED=${NEXT_PUBLIC_DEVTOOLS_ENABLED:-0}
      - ENABLE_NGROK_FOR_DEV=${ENABLE_NGROK_FOR_DEV:-0}
      - ENABLE_CLOUDFLARED_FOR_DEV=${ENABLE_CLOUDFLARED_FOR_DEV:-0}
      - APP_URL_FROM_ANYWHERE=${APP_URL_FROM_ANYWHERE:-}
      - PORT=${APP_PORT:-8080}
      - HOSTNAME=0.0.0.0
      - CHOKIDAR_USEPOLLING=${FRONTEND_CHOKIDAR_USEPOLLING:-1}
      - WATCHPACK_POLLING=${FRONTEND_WATCHPACK_POLLING:-1}
      - APP_NAME=${APP_NAME}
      - UNIQUE_RUNNER_ID=${UNIQUE_RUNNER_ID}
      - UNIQUE_RUN_NUMBER=${UNIQUE_RUN_NUMBER}
    entrypoint: ["/usr/local/bin/dev-env-entrypoint.sh"]
    command: ["npm", "run", "dev"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8080}/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *networks
    profiles:
      - app

  humansonly:
    image: nginx:alpine
    container_name: ${APP_NAME:?Docker Compose Config Error! APP_NAME is not set!}_instance
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    environment:
      - APP_PORT=${APP_PORT:-8080}
    command: /bin/sh -c "envsubst '$$APP_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    ports:
      - "0.0.0.0:${APP_HOST_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8080}/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *networks
    profiles:
      - app

networks:
  app_network:
    external: true
    name: ${COMPOSE_NETWORK_NAME:?Docker Compose Config Error! COMPOSE_NETWORK_NAME is not set!}
